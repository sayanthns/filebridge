plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.enfono.filebridge'
    compileSdk 34

    defaultConfig {
        applicationId "com.enfono.filebridge"
        minSdk 24
        targetSdk 34
        versionCode 11
        versionName "1.10.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'com.google.android.material:material:1.10.0'
    // In-app QR scanner. Chosen over ML Kit because it needs no Play Services
    // and ships its own camera Activity, so the app owns the whole flow.
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
